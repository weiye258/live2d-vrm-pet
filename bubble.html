<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  #bubble {
    position: fixed; left: 0; top: 0;
    transform: translateY(8px) scale(0.96);
    background: rgba(255, 255, 255, 0.95); color: #3a2348;
    padding: 9px 14px; border-radius: 14px 14px 14px 4px;
    font-size: 13px; line-height: 1.5; max-width: 230px;
    box-shadow: 0 8px 26px rgba(0, 0, 0, 0.3);
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    white-space: pre-wrap; word-break: break-word;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #bubble.show { opacity: 1; transform: translateY(0) scale(1); }
</style>
</head>
<body>
  <div id="bubble"></div>
  <script>
    const { ipcRenderer } = require('electron');
    const bubble = document.getElementById('bubble');
    let hideTimer = null;
    ipcRenderer.on('bubble-text', (e, data) => {
      const text = (data && data.text) || '';
      const hold = (data && data.hold) || 4000;
      bubble.textContent = text;
      bubble.classList.add('show');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => bubble.classList.remove('show'), hold);
    });
    ipcRenderer.on('bubble-hide', () => {
      clearTimeout(hideTimer);
      bubble.classList.remove('show');
    });
  </script>
</body>
</html>
